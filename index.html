<!doctype html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Work Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Work Dashboard</h1>

        <div class="row g-3">
            <div class="col-md-3">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <p>ວຽກທັງໝົດ</p>
                        <h2 id="totalWork">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <p>ວຽກສຳເລັດ</p>
                        <h2 id="doneWork">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <p>Test ທັງໝົດ</p>
                        <h2 id="totalTest">0</h2>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card dashboard-card">
                    <div class="card-body">
                        <p>Tracking ຄ້າງ</p>
                        <h2 id="openTracking">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <section class="card mt-4 dashboard-card">
            <div class="card-body">
                <h4>ຈຳນວນວຽກຕາມວັນ</h4>
                <canvas id="workChart"></canvas>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
